spring:
  application:
    name: skin-match-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/skin_match}
    username: ${DATABASE_USER:skin_match}
    password: ${DATABASE_PASSWORD:skin_match}
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: ${PORT:8080}
  error:
    include-message: always

skin-match:
  analyzer-url: ${ANALYZER_URL:http://localhost:8000}
  session-days: 7
  # 画面を別のオリジンで配信するときだけ設定する（例: http://localhost:5173）
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
