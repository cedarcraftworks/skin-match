# ライブラリの更新を月に1回チェックし、種類ごとに1つの PR にまとめて提案する。
# 大きな変更（メジャーバージョンアップ）は動作が変わりやすいので、自動では提案しない。
version: 2
updates:
  - package-ecosystem: maven
    directory: /api
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /analyzer
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
