name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyzer:
    name: Python（判定サービス）
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: analyzer } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: analyzer/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint and format (ruff)
        run: ruff check . && ruff format --check .
      - name: Type check (mypy)
        run: mypy
      - name: Test (pytest)
        run: pytest -q

  api:
    name: Java（API）
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Test with a real PostgreSQL (Testcontainers) and measure coverage (JaCoCo)
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: jacoco-report, path: api/target/site/jacoco }

  web:
    name: TypeScript（画面）
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - name: Lint (Biome)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm test
      - run: npm run build:demo
      - name: End-to-end test in a real browser (Playwright)
        run: npx playwright install --with-deps chromium && npm run e2e
