name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyzer:
    name: Python（判定サービス）
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: analyzer } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: analyzer/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  api:
    name: Java（API）
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skin_match
          POSTGRES_USER: skin_match
          POSTGRES_PASSWORD: skin_match
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skin_match" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -ntp verify
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/skin_match

  web:
    name: TypeScript（画面）
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:demo
